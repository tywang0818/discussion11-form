<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engaged Learning Student Feedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Engaged Learning Student Feedback Form</h1>
        <p class="intro">Share your engaged learning experience to help improve resources and support for UMSI students.</p>
        <form action="https://formspree.io/f/xaeoyoaz" method="post">
            <p class="required-note">Fields marked (required) must be completed.</p>
            <fieldset>
                <legend>Student Information</legend>
                <label for="first-name">First Name (required)</label>
                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>

                <label for="last-name">Last Name (required)</label>
                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>

                <label for="email">Email Address (required)</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="program">Academic Program (required)</label>
                <select id="program" name="program" required>
                    <option value="" disabled selected>Select your program</option>
                    <option value="bsi">BSI</option>
                    <option value="msi">MSI</option>
                    <option value="mhi">MHI</option>
                    <option value="phd">PhD</option>
                    <option value="other">Other</option>
                </select>
            </fieldset>

            <fieldset class="radio-group">
                <legend>Current or Most Recent Project Stage (required)</legend>
                <div class="radio-option">
                    <input type="radio" id="preparing" name="stage" value="preparing" required>
                    <label for="preparing">Preparing for the Experience</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="starting" name="stage" value="starting" required>
                    <label for="starting">Starting the Experience</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="during" name="stage" value="during" required>
                    <label for="during">During the Experience</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="ending" name="stage" value="ending" required>
                    <label for="ending">Ending the Experience</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="after" name="stage" value="after" required>
                    <label for="after">After the Experience</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Your Feedback</legend>
                <label for="project-start-date">Project Start Date (optional)</label>
                <input type="date" id="project-start-date" name="project-start-date">

                <label for="feedback">Your Feedback (required)</label>
                <textarea id="feedback" name="feedback" rows="5" required></textarea>
            </fieldset>
            <input type="submit" value="Submit Feedback">
        </form>
    </main>
</body>
</html>
